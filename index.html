<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M.G.M.R ATELIER — Private Access</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #f7f6f2;
    color: #171717;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

header {
    padding: 32px 42px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #deddd8;
}

.logo {
    font-size: 17px;
    letter-spacing: 7px;
    font-weight: 500;
}

.year {
    font-size: 10px;
    letter-spacing: 3px;
}

main {
    min-height: calc(100vh - 100px);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 60px 25px;
}

.access {
    width: 100%;
    max-width: 680px;
    text-align: center;
}

.eyebrow {
    font-size: 10px;
    letter-spacing: 5px;
    margin-bottom: 30px;
}

h1 {
    font-family: Georgia, serif;
    font-size: clamp(48px, 9vw, 92px);
    font-weight: 400;
    line-height: 0.95;
    letter-spacing: -3px;
    margin-bottom: 32px;
}

.description {
    max-width: 480px;
    margin: 0 auto 50px;
    font-size: 13px;
    line-height: 1.9;
    letter-spacing: 1px;
    color: #555;
}

.button {
    display: inline-block;
    padding: 18px 42px;
    border: 1px solid #171717;
    color: #171717;
    text-decoration: none;
    font-size: 10px;
    letter-spacing: 4px;
    transition: 0.3s;
}

.button:hover {
    background: #171717;
    color: #f7f6f2;
}

.note {
    margin-top: 42px;
    font-size: 9px;
    letter-spacing: 2px;
    color: #777;
}

footer {
    position: fixed;
    bottom: 22px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 8px;
    letter-spacing: 3px;
    color: #999;
}
</style>
</head>

<body>

<header>
    <div class="logo">M.G.M.R</div>
    <div class="year">ATELIER · 2026</div>
</header>

<main>
    <section class="access">

        <div class="eyebrow">
            PRIVATE CLIENT ACCESS
        </div>

        <h1>
            Beyond<br>
            Access.
        </h1>

        <p class="description">
            An invitation to enter the private world of
            M.G.M.R ATELIER. Selected access reserved for
            those seeking a more personal expression of
            modern luxury.
        </p>

        <a href="https://docs.google.com/forms/d/e/1FAIpQLScVk5gxrJkn7Cpl7as5wwHB0ZnSugrKxuksE5LlYZ6hIKQtCw/viewform?usp=header" class="button">
    REQUEST ACCESS
</a>

        <div class="note">
            ACCESS IS LIMITED
        </div>

    </section>
</main>

<footer>
    M.G.M.R ATELIER — PRIVATE ACCESS
</footer>

</body>
</html>
